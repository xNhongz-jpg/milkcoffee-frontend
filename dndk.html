<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Đăng nhập/Đăng ký - Milk Coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #182b47 0%, #0f1a30 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(21,101,192,0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 80% 20%, rgba(66,165,245,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #1565C0, #42a5f5);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(21,101,192,0.3);
            transition: transform 0.3s ease;
        }

        .logo-icon:hover {
            transform: scale(1.05);
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1565C0, #3B5998);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .tagline {
            text-align: center;
            color: #6f7c8f;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 2px solid #e8ecef;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #8a99b0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: #1565C0;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #1565C0, #42a5f5);
            border-radius: 3px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .tab:hover:not(.active) {
            color: #1565C0;
        }

        .form-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .form-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #414141;
            margin-bottom: 8px;
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #1565C0;
            font-size: 1rem;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .input-field input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #D0D0D0;
            border-radius: 30px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
            background: #F8F9FC;
        }

        .input-field input:focus {
            border-color: #1565C0;
            background: white;
            box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
        }

        .input-field input.error {
            border-color: #e64949;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-message {
            color: #e64949;
            font-size: 0.75rem;
            margin-top: 6px;
            margin-left: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .btn-auth {
            width: 100%;
            background: linear-gradient(135deg, #1565C0, #0f4d96);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-auth::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-auth:hover::before {
            left: 100%;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(21,101,192,0.4);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .info-text {
            text-align: center;
            margin-top: 24px;
            color: #6f7c8f;
            font-size: 0.85rem;
        }

        .info-text a {
            color: #1565C0;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .info-text a:hover {
            text-decoration: underline;
            color: #0f4d96;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1565C0, #0f4d96);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            z-index: 2000;
            animation: slideUp 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
            font-size: 0.9rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .toast-message.error {
            background: linear-gradient(135deg, #e64949, #c21818);
        }

        .toast-message i {
            font-size: 1.2rem;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .password-strength {
            margin-top: 8px;
            margin-left: 16px;
            font-size: 0.7rem;
        }

        .strength-bar {
            height: 3px;
            width: 0%;
            background: #e64949;
            border-radius: 3px;
            transition: width 0.3s ease, background 0.3s ease;
            margin-top: 4px;
        }

        .strength-text {
            color: #6f7c8f;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 32px 24px;
            }
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            .logo-text {
                font-size: 1.5rem;
            }
            .toast-message {
                padding: 10px 20px;
                font-size: 0.85rem;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-mug-hot"></i>
                </div>
                <div class="logo-text">Milk Coffee</div>
                <div class="tagline">Học tập thông minh - Cùng nhau tiến bộ</div>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="login">Đăng nhập</div>
                <div class="tab" data-tab="register">Đăng ký</div>
            </div>

            <!-- Form Đăng nhập -->
            <div class="form-panel active" id="loginPanel">
                <form id="loginForm">
                    <div class="input-group">
                        <label>Tên tài khoản</label>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" id="loginUsername" placeholder="Nhập tên tài khoản" autocomplete="off">
                        </div>
                        <div class="error-message" id="loginError"></div>
                    </div>
                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Nhập mật khẩu">
                        </div>
                        <div class="error-message" id="loginPasswordError"></div>
                    </div>
                    <button type="submit" class="btn-auth">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>
                    <div class="info-text">
                        Chưa có tài khoản? <a href="#" id="switchToRegister">Đăng ký ngay</a>
                    </div>
                </form>
            </div>

            <!-- Form Đăng ký -->
            <div class="form-panel" id="registerPanel">
                <form id="registerForm">
                    <div class="input-group">
                        <label>Tên tài khoản</label>
                        <div class="input-field">
                            <i class="fas fa-user-plus"></i>
                            <input type="text" id="regUsername" placeholder="Nhập tên tài khoản (tối thiểu 3 ký tự)" autocomplete="off">
                        </div>
                        <div class="error-message" id="regUsernameError"></div>
                    </div>
                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)">
                        </div>
                        <div class="error-message" id="regPasswordError"></div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar" id="strengthBar"></div>
                            <span class="strength-text" id="strengthText"></span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Xác nhận mật khẩu</label>
                        <div class="input-field">
                            <i class="fas fa-check-circle"></i>
                            <input type="password" id="regConfirmPassword" placeholder="Nhập lại mật khẩu">
                        </div>
                        <div class="error-message" id="regConfirmError"></div>
                    </div>
                    <div class="input-group">
                        <label>Tên hiển thị</label>
                        <div class="input-field">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="regDisplayName" placeholder="Tên sẽ hiển thị trên hệ thống">
                        </div>
                    </div>
                    <button type="submit" class="btn-auth">
                        <i class="fas fa-user-plus"></i> Đăng ký
                    </button>
                    <div class="info-text">
                        Đã có tài khoản? <a href="#" id="switchToLogin">Đăng nhập ngay</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        function showToast(message, isSuccess = true) {
            const oldToast = document.querySelector('.toast-message');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            if (!isSuccess) toast.classList.add('error');
            toast.innerHTML = `<i class="fas ${isSuccess ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            if (!password) {
                strengthBar.style.width = '0%';
                strengthText.textContent = '';
                return;
            }
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const percentages = [0, 20, 40, 60, 80, 100];
            const colors = ['#e64949', '#e64949', '#f4a261', '#f4a261', '#2ecc71', '#27ae60'];
            const texts = ['', 'Rất yếu', 'Yếu', 'Trung bình', 'Mạnh', 'Rất mạnh'];
            
            let index = Math.min(Math.floor(strength), 5);
            if (password.length < 6) index = 1;
            
            strengthBar.style.width = percentages[index] + '%';
            strengthBar.style.background = colors[index];
            strengthText.textContent = texts[index];
        }

        // Xử lý tab
        const tabs = document.querySelectorAll('.tab');
        const loginPanel = document.getElementById('loginPanel');
        const registerPanel = document.getElementById('registerPanel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                if (tab.dataset.tab === 'login') {
                    loginPanel.classList.add('active');
                    registerPanel.classList.remove('active');
                } else {
                    loginPanel.classList.remove('active');
                    registerPanel.classList.add('active');
                }
                
                document.querySelectorAll('.error-message').forEach(el => {
                    el.classList.remove('show');
                    el.textContent = '';
                });
                document.querySelectorAll('.input-field input').forEach(input => {
                    input.classList.remove('error');
                });
            });
        });

        document.getElementById('switchToRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.tab[data-tab="register"]').click();
        });
        
        document.getElementById('switchToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.tab[data-tab="login"]').click();
        });

        const regPassword = document.getElementById('regPassword');
        regPassword.addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
        });

        // XỬ LÝ ĐĂNG NHẬP
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            document.querySelectorAll('#loginPanel .error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            document.querySelectorAll('#loginPanel .input-field input').forEach(input => {
                input.classList.remove('error');
            });
            
            let hasError = false;
            
            if (!username) {
                document.getElementById('loginError').textContent = 'Vui lòng nhập tên tài khoản';
                document.getElementById('loginError').classList.add('show');
                document.getElementById('loginUsername').classList.add('error');
                hasError = true;
            }
            
            if (!password) {
                document.getElementById('loginPasswordError').textContent = 'Vui lòng nhập mật khẩu';
                document.getElementById('loginPasswordError').classList.add('show');
                document.getElementById('loginPassword').classList.add('error');
                hasError = true;
            }
            
            if (hasError) return;
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Đăng nhập thất bại');
                
                if (data.success && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('🎉 Đăng nhập thành công!');
                    setTimeout(() => {
                        window.location.href = 'bangdieukhien.html';
                    }, 1000);
                }
            } catch (error) {
                document.getElementById('loginError').textContent = error.message;
                document.getElementById('loginError').classList.add('show');
                document.getElementById('loginUsername').classList.add('error');
                document.getElementById('loginPassword').classList.add('error');
                showToast('❌ ' + error.message, false);
            }
        });

        // XỬ LÝ ĐĂNG KÝ
        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const displayName = document.getElementById('regDisplayName').value.trim();
            
            document.querySelectorAll('#registerPanel .error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            document.querySelectorAll('#registerPanel .input-field input').forEach(input => {
                input.classList.remove('error');
            });
            
            let hasError = false;
            
            if (!username) {
                document.getElementById('regUsernameError').textContent = 'Vui lòng nhập tên tài khoản';
                document.getElementById('regUsernameError').classList.add('show');
                document.getElementById('regUsername').classList.add('error');
                hasError = true;
            } else if (username.length < 3) {
                document.getElementById('regUsernameError').textContent = 'Tên tài khoản phải có ít nhất 3 ký tự';
                document.getElementById('regUsernameError').classList.add('show');
                document.getElementById('regUsername').classList.add('error');
                hasError = true;
            } else if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                document.getElementById('regUsernameError').textContent = 'Tên tài khoản chỉ gồm chữ, số và dấu gạch dưới';
                document.getElementById('regUsernameError').classList.add('show');
                document.getElementById('regUsername').classList.add('error');
                hasError = true;
            }
            
            if (!password) {
                document.getElementById('regPasswordError').textContent = 'Vui lòng nhập mật khẩu';
                document.getElementById('regPasswordError').classList.add('show');
                document.getElementById('regPassword').classList.add('error');
                hasError = true;
            } else if (password.length < 6) {
                document.getElementById('regPasswordError').textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                document.getElementById('regPasswordError').classList.add('show');
                document.getElementById('regPassword').classList.add('error');
                hasError = true;
            }
            
            if (password !== confirmPassword) {
                document.getElementById('regConfirmError').textContent = 'Mật khẩu xác nhận không khớp';
                document.getElementById('regConfirmError').classList.add('show');
                document.getElementById('regConfirmPassword').classList.add('error');
                hasError = true;
            }
            
            if (hasError) return;
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, displayName })
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Đăng ký thất bại');
                
                if (data.success) {
                    showToast('🎉 Đăng ký thành công!');
                    setTimeout(() => {
                        document.querySelector('.tab[data-tab="login"]').click();
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginPassword').value = '';
                        showToast('✅ Hãy đăng nhập để tiếp tục!');
                    }, 1000);
                }
            } catch (error) {
                document.getElementById('regUsernameError').textContent = error.message;
                document.getElementById('regUsernameError').classList.add('show');
                showToast('❌ ' + error.message, false);
            }
        });
        
        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
        });
        document.getElementById('regConfirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') registerForm.dispatchEvent(new Event('submit'));
        });
        
        // Kiểm tra đã đăng nhập chưa
        if (localStorage.getItem('token')) {
            window.location.href = 'bangdieukhien.html';
        }
    </script>
</body>
</html>
